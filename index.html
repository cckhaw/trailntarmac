<div id="wrap"><canvas id="c" tabindex="0" aria-label="Trail and Tarmac arcade game"></canvas></div>
<script>
(() => {
'use strict';

/* ======================================================================
   TRAIL & TARMAC  -  single-file HTML5 arcade game
   Stage 1: trail running (jump / sprint / stamina)
   Stage 2: road cycling (cadence / drafting / slipstream breakaway)
   ====================================================================== */

const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const qs = new URLSearchParams(location.search);
const DUR = Math.min(60, Math.max(4, +qs.get('dur') || 60));   // seconds per stage (60 by default)
const TRANSITION_T = 3.2;
const BOOST_WINDOW = 15;                                       // breakaway unlocks for the last N seconds
const GY = 440;                                                // trail ground line
const LANE_Y = [352, 400, 448, 496], LANE_S = [0.92, 1.0, 1.08, 1.16];
const PX = 250;                                                // player screen x on the road
const RUN_X = 150;                                             // runner screen x on the trail
const PX_PER_M = 20;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const fH = s => `900 ${s}px "Arial Black","Helvetica Neue",Impact,Arial,sans-serif`;
const fM = s => `bold ${s}px "Courier New",ui-monospace,Menlo,Consolas,monospace`;

/* ---------------------------------------------------------------- canvas sizing */
let scale = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(2, Math.round(r.width * dpr));
  cv.height = Math.max(2, Math.round(r.height * dpr));
  scale = cv.width / W;
}
window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- storage */
const LS_INIT = 'trailtarmac.initials.v1';
const mem = {};
function lsGet(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return mem[k] ?? null; }
function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
const MODES = ['full', 'trail', 'road'];
const MODE_NAME = { full: 'FULL RACE', trail: 'TRAIL RUNNING', road: 'ROAD CYCLING' };
const lsKey = m => 'trailtarmac.scores.v2.' + m;
function parseScores(raw) {
  try {
    const a = JSON.parse(raw);
    if (Array.isArray(a)) return a.filter(e => e && typeof e.n === 'string' && Number.isFinite(e.s)).sort((x, y) => y.s - x.s).slice(0, 10);
  } catch (e) {}
  return [];
}
function loadScores(m) {
  let a = parseScores(lsGet(lsKey(m)));
  if (!a.length && m === 'full') a = parseScores(lsGet('trailtarmac.scores.v1'));   // migrate old single board
  return a;
}
const scoresBy = { full: loadScores('full'), trail: loadScores('trail'), road: loadScores('road') };
const saveScores = m => lsSet(lsKey(m), JSON.stringify(scoresBy[m]));
// "Simulated global" boards: seeded riders from around the world, merged with this player's submissions.
const GLOBAL_SEEDS = {
  full:  [{ n: 'KOM', s: 6900 }, { n: 'ACE', s: 5800 }, { n: 'FOX', s: 4700 }, { n: 'PEL', s: 3800 }, { n: 'TRL', s: 3000 }],
  trail: [{ n: 'RUN', s: 3600 }, { n: 'FOX', s: 3100 }, { n: 'ELK', s: 2600 }, { n: 'MUD', s: 2100 }, { n: 'ROK', s: 1600 }],
  road:  [{ n: 'KOM', s: 3500 }, { n: 'PEL', s: 3000 }, { n: 'ACE', s: 2500 }, { n: 'GEO', s: 2000 }, { n: 'TTT', s: 1500 }]
};
function globalBoard(m) {
  return GLOBAL_SEEDS[m].map(e => ({ ...e })).concat(scoresBy[m].map(e => ({ n: e.n, s: e.s, me: e })))
    .sort((a, b) => b.s - a.s).slice(0, 5);
}
const bestScore = m => scoresBy[m].length ? scoresBy[m][0].s : 0;

/* ---------------------------------------------------------------- audio (Web Audio only) */
const SFX = {
  ctx: null, master: null, nbuf: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(c.destination);
      const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.nbuf = b;
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; lsSet('trailtarmac.muted', m ? '1' : '0'); },
  tone(f, d, type = 'square', v = 0.15, f2 = null, delay = 0) {
    const c = this.ctx; if (!c || this.muted) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v = 0.15, f = 2000, type = 'highpass', f2 = null, delay = 0) {
    const c = this.ctx; if (!c || this.muted) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nbuf; fl.type = type; fl.frequency.setValueAtTime(f, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t); s.stop(t + d + 0.03);
  },
  jump()  { this.tone(380, 0.15, 'square', 0.14, 840); },
  land()  { this.noise(0.06, 0.12, 400, 'lowpass'); },
  step()  { this.noise(0.03, 0.05, 900, 'bandpass'); },
  clear(c = 0) { this.tone(660 + c * 30, 0.08, 'square', 0.1); this.tone(990 + c * 40, 0.12, 'square', 0.1, null, 0.07); },
  sprint(){ this.noise(0.4, 0.12, 500, 'bandpass', 2600); this.tone(220, 0.25, 'sawtooth', 0.06, 440); },
  tick(c) { this.noise(0.022, 0.1, 3200 + c * 2500, 'highpass'); this.tone(170 + c * 140, 0.035, 'square', 0.05); },
  alarm() { this.tone(880, 0.12, 'square', 0.13); this.tone(620, 0.12, 'square', 0.13, null, 0.15); },
  trip()  { this.tone(280, 0.55, 'sawtooth', 0.18, 50); this.noise(0.3, 0.2, 500, 'lowpass'); },
  bump()  { this.noise(0.18, 0.2, 700, 'lowpass'); this.tone(130, 0.2, 'square', 0.16, 55); },
  draft() { this.tone(520, 0.07, 'triangle', 0.1, 780); },
  pass()  { this.tone(520, 0.07, 'triangle', 0.12, 980); },
  boost() { this.noise(0.9, 0.16, 300, 'bandpass', 4200); this.tone(260, 0.7, 'sawtooth', 0.09, 900); },
  blip()  { this.tone(620, 0.05, 'square', 0.08); },
  move()  { this.tone(440, 0.04, 'square', 0.06); },
  confirm(){ this.tone(520, 0.08, 'square', 0.1); this.tone(780, 0.14, 'square', 0.1, null, 0.08); },
  start() { [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.12, 'square', 0.1, null, i * 0.07)); },
  transition() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.14, null, i * 0.11)); this.noise(0.5, 0.08, 800, 'bandpass', 3000, 0.1); },
  countdown() { this.tone(660, 0.12, 'square', 0.1); },
  victory() {
    const n = [523, 659, 784, 1047, 784, 1047, 1319];
    n.forEach((f, i) => { this.tone(f, 0.2, 'square', 0.11, null, i * 0.13); this.tone(f / 2, 0.2, 'triangle', 0.1, null, i * 0.13); });
    [523, 659, 784, 1047].forEach(f => this.tone(f, 1.0, 'triangle', 0.09, null, 0.95));
  }
};
try { SFX.muted = lsGet('trailtarmac.muted') === '1'; } catch (e) {}

/* ---------------------------------------------------------------- game state */
let mode = 'title';           // title | play | over | lb
let menuSel = 0, lbTab = 0, pauseSel = 0;
let paused = false;
let tNow = 0, shake = 0, touchSeen = false, titleT = 0;
let R = null;                 // current run
let OV = null;                // game-over / leaderboard state
const keys = {};
const parts = [], pops = [];
const ptrs = new Map();

function newRun(m) {
  R = {
    mode: m || 'full', phase: 'trail', stageT: 0, trT: 0, finT: 0, alarmT: 0, hintT: 0,
    // scores
    trailPx: 0, roadPx: 0, jumps: 0, jumpPts: 0, sprintPts: 0, draftPts: 0, overPts: 0, boostPts: 0, stamPts: 0, penalty: 0,
    stamina: 100, combo: 0, bestCombo: 0, trips: 0, overtakes: 0,
    // trail
    spd: 300, p: { h: 0, vy: 0, onGround: true, stun: 0, ph: 0 },
    holding: false, holdT: 0, lastPress: -9, burst: 0, winded: false, wasSprint: false, sprinting: false,
    obs: [], spawnT: 1.2, stepT: 0, tripped: false,
    // road
    rd: null
  };
}
function newRoad() {
  const rd = {
    cad: 0.35, lastSide: -1, spd: 300, laneF: 1, target: 1, ph: 0, wr: 0, bonk: 0, bump: 0, slip: 0,
    boostOn: false, boosting: false, drafting: false, wasDraft: false, rivals: [], hold: false, boostMsgT: 0, tickT: 0
  };
  rd.d = 0;
  for (let i = 0; i < 9; i++) { const r = mkRival(rd, 220 + i * 150 + rand(0, 80)); r.d = r.off; rd.rivals.push(r); }
  return rd;
}
const RIVAL_COLS = ['#ffd23f', '#3a86ff', '#ff7b00', '#d62ed6', '#17c3b2', '#f8f9fa', '#8ac926', '#6a4c93'];
function mkRival(rd, off, init) {
  let lane = 0, tries = 0;
  do { lane = (Math.random() * 4) | 0; tries++; }
  while (tries < 12 && rd.rivals.some(o => Math.abs(o.laneF - lane) < 0.5 && Math.abs((o.d !== undefined ? o.d - (rd.d || 0) : o.off) - off) < 110));
  return {
    laneF: lane, lane, off, base: rand(405, 520), phs: rand(0, 6), col: RIVAL_COLS[(Math.random() * RIVAL_COLS.length) | 0],
    ph: rand(0, 6), wr: 0, laneT: rand(5, 11), wasAhead: true, v: 450
  };
}

function startGame(m) {
  SFX.init(); SFX.start();
  newRun(m || 'full'); mode = 'play'; paused = false; OV = null;
  parts.length = 0; pops.length = 0; ptrs.clear();
  if (R.mode === 'road') beginRoad(false);
}
function beginRoad(carry) {
  R.phase = 'road'; R.stageT = 0; R.hintT = 0; R.rd = newRoad(); R.rd.holdPtrs = 0;
  R.stamina = carry ? Math.min(100, R.stamina + 40) : 100; R.obs.length = 0; pops.length = 0; parts.length = 0;
}
function quitToMenu() {
  paused = false; mode = 'title'; R = null; OV = null; ptrs.clear(); parts.length = 0; pops.length = 0; menuSel = 0; SFX.blip();
}
const MENU = [
  { t: 'FULL RACE   (TRAIL > ROAD)', a: () => startGame('full') },
  { t: 'TRAIL RUNNING ONLY', a: () => startGame('trail') },
  { t: 'ROAD CYCLING ONLY', a: () => startGame('road') },
  { t: 'LEADERBOARDS', a: () => { mode = 'lb'; lbTab = 0; SFX.blip(); } }
];
const menuRect = i => ({ x: W / 2 - 210, y: 387 + i * 28, w: 420, h: 27 });
const PAUSE_ITEMS = ['RESUME', 'RESTART', 'QUIT TO MAIN MENU'];
const pauseRect = i => ({ x: W / 2 - 170, y: 270 + i * 50, w: 340, h: 40 });
function pauseAct(i) { if (i === 0) togglePause(); else if (i === 1) { const m = R.mode; startGame(m); } else quitToMenu(); }
const LBT = i => ({ x: 90 + i * 270, y: 62, w: 250, h: 34 });
const LB_BACK = { x: W / 2 - 100, y: 492, w: 200, h: 34 };

/* ---------------------------------------------------------------- scoring */
const distM = () => (R.trailPx + R.roadPx) / PX_PER_M;
function totalScore() {
  return Math.max(0, Math.floor(distM() + R.jumpPts + R.sprintPts + R.draftPts + R.overPts + R.boostPts + R.stamPts - R.penalty));
}

/* ---------------------------------------------------------------- fx helpers */
function pop(text, x, y, color = '#fff', size = 22) { pops.push({ text, x, y, t: 0, color, size }); }
function puff(x, y, n, col = '#b98c5a', sp = 1) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-60, 20) * sp - 30, vy: rand(-90, -10) * sp, l: 0, m: rand(0.3, 0.6), r: rand(2, 5), c: col, g: 200 });
}

/* ---------------------------------------------------------------- input -> game */
function trailPress() {
  if (!R || R.phase !== 'trail' || paused) return;
  const now = performance.now(), p = R.p;
  R.holding = true; R.holdT = 0;
  if (p.stun > 0) return;
  if (now - R.lastPress < 320 && R.stamina > 5 && !R.winded) { R.burst = 1.3; }
  R.lastPress = now;
  if (p.onGround) { p.vy = 830; p.onGround = false; SFX.jump(); puff(RUN_X - 8, GY, 4, '#b98c5a', 0.6); }
}
function trailRelease() { if (R) R.holding = false; }

function padTap(side) {
  if (!R || R.phase !== 'road') return;
  const rd = R.rd;
  rd.cad = Math.min(1, rd.cad + (side !== rd.lastSide ? 0.15 : 0.07));
  rd.lastSide = side; rd.ph += 0.9; SFX.tick(rd.cad);
}
function laneMove(d) {
  if (!R || R.phase !== 'road') return;
  const rd = R.rd, n = clamp(rd.target + d, 0, 3);
  if (n !== rd.target) { rd.target = n; SFX.move(); }
}
function setBoost(on) {
  if (!R || R.phase !== 'road') return;
  const rd = R.rd;
  if (on && !rd.boostOn) {
    if (BOOST_WINDOW < DUR - R.stageT) rd.boostMsgT = 1.6;   // too early
    else if (rd.slip < 8) rd.boostMsgT = 1.6;                // no slipstream stored
  }
  rd.boostOn = on;
}
const roadHold = () => !!(keys.Space || R && R.rd && R.rd.holdPtrs > 0);

function togglePause() {
  if (mode !== 'play') return;
  paused = !paused; SFX.blip(); pauseSel = 0;
  if (paused) { R.holding = false; if (R.rd) R.rd.boostOn = false; }
}

const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function onKeyDown(e) {
  const c = e.code;
  if (c === 'KeyM' && !(mode === 'over' && OV && OV.mode === 'entry')) { SFX.setMuted(!SFX.muted); return; }
  if (mode === 'title') {
    if (c === 'ArrowUp' || c === 'KeyW') { menuSel = (menuSel + MENU.length - 1) % MENU.length; SFX.move(); }
    else if (c === 'ArrowDown' || c === 'KeyS') { menuSel = (menuSel + 1) % MENU.length; SFX.move(); }
    else if (c === 'Enter' || c === 'Space' || c === 'NumpadEnter') MENU[menuSel].a();
    else if (/^(Digit|Numpad)[1-4]$/.test(c)) { menuSel = +c.slice(-1) - 1; MENU[menuSel].a(); }
    return;
  }
  if (mode === 'lb') {
    if (c === 'ArrowLeft' || c === 'KeyA') { lbTab = (lbTab + 2) % 3; SFX.move(); }
    else if (c === 'ArrowRight' || c === 'KeyD' || c === 'Tab') { lbTab = (lbTab + 1) % 3; SFX.move(); }
    else if (/^(Digit|Numpad)[1-3]$/.test(c)) { lbTab = +c.slice(-1) - 1; SFX.move(); }
    else if (c === 'Escape' || c === 'Enter' || c === 'Space' || c === 'Backspace') { mode = 'title'; SFX.blip(); }
    return;
  }
  if (mode === 'over') { overKey(c, e.key); return; }
  if (c === 'KeyP' || c === 'Escape') { togglePause(); return; }
  if (paused) {
    if (c === 'ArrowUp' || c === 'KeyW') { pauseSel = (pauseSel + 2) % 3; SFX.move(); }
    else if (c === 'ArrowDown' || c === 'KeyS') { pauseSel = (pauseSel + 1) % 3; SFX.move(); }
    else if (c === 'Enter' || c === 'Space') pauseAct(pauseSel);
    else if (c === 'KeyQ') quitToMenu();
    return;
  }
  if (R.phase === 'trail') {
    if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') trailPress();
  } else if (R.phase === 'road') {
    if (c === 'Space') padTap(2);
    else if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyZ') padTap(0);
    else if (c === 'ArrowRight' || c === 'KeyD' || c === 'KeyX') padTap(1);
    else if (c === 'ArrowUp' || c === 'KeyW') laneMove(-1);
    else if (c === 'ArrowDown' || c === 'KeyS') laneMove(1);
    else if (c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyB' || c === 'KeyE') setBoost(true);
  }
}
function onKeyUp(e) {
  const c = e.code;
  if (!R || mode !== 'play') return;
  if (R.phase === 'trail' && (c === 'Space' || c === 'ArrowUp' || c === 'KeyW')) trailRelease();
  if (R.phase === 'road' && (c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyB' || c === 'KeyE')) setBoost(false);
}
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true; SFX.init(); onKeyDown(e);
});
window.addEventListener('keyup', e => { keys[e.code] = false; onKeyUp(e); });
window.addEventListener('blur', () => { if (mode === 'play' && !paused) togglePause(); for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused) togglePause(); });

/* ---- pointer / touch ---- */
const BTN = {
  up:    { x: 18,  y: 342, w: 96,  h: 70 },
  down:  { x: 18,  y: 424, w: 96,  h: 70 },
  boost: { x: W - 176, y: 410, w: 150, h: 84 },
  mute:  { x: W - 40, y: H - 38, w: 30, h: 28 }

  const b = (r, label, on) => {
    ctx.globalAlpha = on ? 0.85 : 0.5; ctx.fillStyle = '#10261a'; rr(r.x, r.y, r.w, r.h, 14); ctx.fill();
    ctx.strokeStyle = on ? '#7df9ff' : '#ffffff'; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
    txt(label, r.x + r.w / 2, r.y + r.h / 2, label.length > 2 ? 20 : 30, '#fff', 'center');
  };
  b(BTN.up, '▲', false); b(BTN.down, '▼', false); b(BTN.boost, 'BOOST', R.rd.boostOn);
}
function drawMuteIcon() {
  const r = BTN.mute; ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(r.x + 4, r.y + 10); ctx.lineTo(r.x + 10, r.y + 10); ctx.lineTo(r.x + 17, r.y + 4); ctx.lineTo(r.x + 17, r.y + 24); ctx.lineTo(r.x + 10, r.y + 18); ctx.lineTo(r.x + 4, r.y + 18); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
  if (SFX.muted) { ctx.beginPath(); ctx.moveTo(r.x + 20, r.y + 9); ctx.lineTo(r.x + 28, r.y + 19); ctx.moveTo(r.x + 28, r.y + 9); ctx.lineTo(r.x + 20, r.y + 19); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(r.x + 17, r.y + 14, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(r.x + 17, r.y + 14, 11, -0.9, 0.9); ctx.stroke(); }
  ctx.restore();
}
function banner(text, sub, a, color = '#ffe66d') {
  ctx.globalAlpha = clamp(a, 0, 1);
  txt(text, W / 2, 196, 52, color, 'center'); if (sub) txt(sub, W / 2, 238, 17, '#fff', 'center', fM);
  ctx.globalAlpha = 1;
}
function hint(lines, a) {
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = 'rgba(6,18,12,.7)'; rr(W / 2 - 330, 102, 660, 14 + lines.length * 24, 12); ctx.fill();
  lines.forEach((l, i) => txt(l, W / 2, 122 + i * 24, 15, '#fff', 'center', fM, false));
  ctx.globalAlpha = 1;
}

function renderPlay() {
  if (R.phase === 'trail' || R.phase === 'transition' || R.phase === 'tfinish') {
    const scroll = R.trailPx;
    drawTrailScene(scroll);
    if (R.phase === 'trail' ? DUR - R.stageT < 5 : true) drawGantry(R.gateX, 'gate');
    for (const o of R.obs) o.t === 'log' ? drawLog(o) : drawRock(o);
    const p = R.p;
    drawRunner(RUN_X, GY, p.ph, { air: !p.onGround, sprint: R.sprinting, tripped: R.tripped && p.stun > 0.15, h: p.h });
    if (R.sprinting) {
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) { const y = GY - 70 + ((i * 29 + tNow * 900) % 80), x = RUN_X - 40 - ((i * 53 + tNow * 1300) % 120); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 36, y); ctx.stroke(); }
    }
  } else {
    const rd = R.rd, scroll = rd.d;
    drawRoadScene(scroll);
    if (R.phase === 'road' || R.phase === 'finish') {
      const remPx = Math.max(0, DUR - R.stageT) * rd.spd;
      if (R.phase === 'road' && DUR - R.stageT < 6) drawGantry(PX + remPx, 'finish');
      if (R.phase === 'finish') drawGantry(PX - (rd.d - R.finD0), 'finish');
    }
    // draw order by lane
    const list = rd.rivals.map(r => ({ y: r.laneF, r })).concat([{ y: rd.laneF, me: true }]).sort((a, b) => a.y - b.y);
    for (const it of list) {
      if (it.me) {
        const y = laneAt(rd.laneF, LANE_Y), s = laneAt(rd.laneF, LANE_S);
        if (rd.drafting || rd.boosting) {
          ctx.strokeStyle = rd.boosting ? 'rgba(125,249,255,.8)' : 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
          for (let i = 0; i < 5; i++) { const yy = y - 14 - i * 11 * s, xx = PX - 50 - ((i * 47 + tNow * 700) % 110); ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx - 40, yy); ctx.stroke(); }
        }
        drawCyclist(PX, y, s, '#e63946', rd.ph, rd.wr, { me: true, lean: rd.bonk > 0 ? -0.08 : 0 });
        ctx.fillStyle = '#ffe66d'; ctx.beginPath(); const ay = y - 98 * s; ctx.moveTo(PX + 12, ay + 10); ctx.lineTo(PX + 24, ay + 10); ctx.lineTo(PX + 18, ay + 20); ctx.closePath(); ctx.fill();
      } else {
        const r = it.r, x = PX + (r.d - rd.d), y = laneAt(r.laneF, LANE_Y), s = laneAt(r.laneF, LANE_S);
        if (x > -90 && x < W + 90) drawCyclist(x, y, s, r.col, r.ph, r.wr);
      }
    }
  }
  // particles, popups
  for (const q of parts) {
    ctx.globalAlpha = clamp(1 - q.l / q.m, 0, 1); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const q of pops) {
    ctx.globalAlpha = clamp(1.3 - q.t, 0, 1); txt(q.text, q.x, q.y - q.t * 50, q.size, q.color, 'center');
  }
  ctx.globalAlpha = 1;
}

function renderOverlays() {
  drawHUD();
  if (R.phase === 'trail') {
    banner('TRAIL RUNNING', 'GO GO GO!', 1.6 - R.stageT / 1.2);
    hint(['TAP / SPACE : JUMP     HOLD or DOUBLE-TAP : SPRINT', 'Sprinting drains stamina - rest or clear obstacles to recover'], 1 - (R.hintT - 3.5) / 1.2);
  } else if (R.phase === 'transition') {
    ctx.fillStyle = 'rgba(6,18,12,.72)'; ctx.fillRect(0, 100, W, 330);
    const n = clamp(Math.ceil(TRANSITION_T - R.trT), 1, 3);
    txt('TRAIL COMPLETE!', W / 2, 150, 40, '#ffe66d', 'center');
    txt('Stamina bonus  +' + R.stamPts + '     Clean jumps ' + R.jumps, W / 2, 196, 17, '#fff', 'center', fM);
    ctx.save(); ctx.translate(W / 2, 288); drawRunner(-90, 36, tNow * 12, { sprint: true });
    drawCyclist(90, 36, 1.3, '#e63946', tNow * 8, tNow * 6, { me: true }); ctx.restore();
    txt('SWAP TO THE BIKE  >>>', W / 2, 352, 24, '#7df9ff', 'center');
    txt('ROAD CYCLING STARTS IN ' + n, W / 2, 392, 20, '#fff', 'center');
  } else if (R.phase === 'road') {
    const rd = R.rd, rem = DUR - R.stageT;
    banner('ROAD CYCLING', 'PEDAL! DRAFT BEHIND RIVALS', 1.6 - R.stageT / 1.2, '#ffd23f');
    hint(['TAP SPACE or ← → (alternate) to pedal  |  HOLD SPACE = steady cadence', '↑ ↓ change lane  |  Sit behind rivals to draft & fill SLIPSTREAM', 'Last 15s: hold SHIFT / B (BOOST) for the BREAKAWAY'], 1 - (R.hintT - 5) / 1.2);
    if (rem <= BOOST_WINDOW && rem > BOOST_WINDOW - 2.5) banner('FINAL STRETCH', null, 1, '#7df9ff');
    if (rem <= BOOST_WINDOW && rd.slip >= 15 && !rd.boosting && Math.floor(tNow * 4) % 2 === 0)
      txt('BREAKAWAY READY - HOLD SHIFT / BOOST', W / 2, 126, 18, '#7df9ff', 'center');
    if (rd.boostMsgT > 0) txt(rem > BOOST_WINDOW ? 'BREAKAWAY UNLOCKS IN FINAL 15s' : 'BUILD SLIPSTREAM FIRST - DRAFT!', W / 2, 150, 17, '#ffb04d', 'center');
    if (rd.drafting) txt('DRAFTING', PX + 10, laneAt(rd.laneF, LANE_Y) - 108 * laneAt(rd.laneF, LANE_S), 14, '#d6f6ff', 'center', fM);
    // cadence gauge
    const cx = W - 120, cy = H - 62;
    if (!touchSeen) {
      ctx.fillStyle = 'rgba(6,18,12,.6)'; rr(W - 250, H - 54, 200, 40, 10); ctx.fill();
      txt('CADENCE', W - 240, H - 34, 12, '#cfe8d6', 'left', fM, false);
      bar(W - 170, H - 42, 112, 16, rd.cad, '#2aa9ff', '#ffd23f');
    }
    drawTouchControls();
  }
  drawMuteIcon();
}

function drawPanel(x, y, w, h, title, col) {
  ctx.fillStyle = 'rgba(6,18,12,.82)'; rr(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; rr(x, y, w, h, 12); ctx.stroke();
  txt(title, x + w / 2, y + 24, 17, col, 'center');
  ctx.fillStyle = col; ctx.globalAlpha = 0.5; ctx.fillRect(x + 14, y + 42, w - 28, 2); ctx.globalAlpha = 1;
}
function drawBoard(x, y, w, rows, hl, rowH, size) {
  rows.forEach((e, i) => {
    const yy = y + i * rowH, me = hl && (e === hl || e.me === hl);
    if (me) { ctx.fillStyle = 'rgba(255,230,109,' + (0.18 + 0.12 * Math.sin(tNow * 8)) + ')'; rr(x - 8, yy - rowH / 2 + 2, w + 16, rowH - 2, 6); ctx.fill(); }
    const col = i === 0 ? '#ffe66d' : i < 3 ? '#e8f1ff' : '#a8c7b3';
    txt(String(i + 1).padStart(2, ' ') + '.', x, yy, size, col, 'left', fM, false);
    txt(e.n, x + 48, yy, size, me ? '#7df9ff' : col, 'left', fM, false);
    txt(String(e.s).padStart(6, '0'), x + w, yy, size, col, 'right', fM, false);
  });
  if (!rows.length) txt('NO SCORES YET', x + w / 2, y + 30, size, '#7f9c8a', 'center', fM, false);
}

function renderOver() {
  // backdrop: slowly scrolling road/trail
  drawRoadScene(tNow * 120);
  ctx.fillStyle = 'rgba(4,14,9,.72)'; ctx.fillRect(0, 0, W, H);
  txt(MODE_NAME[OV.rm], W / 2, 10, 12, '#7df9ff', 'center', fM, false);
  txt('GAME OVER', W / 2, 38, 40, '#ffe66d', 'center');
  txt('FINAL SCORE ' + String(OV.s).padStart(6, '0'), W / 2, 76, 22, '#fff', 'center', fM);
  if (OV.newBest && OV.s > 0) txt('NEW HIGH SCORE!', W / 2, 98, 15, Math.floor(tNow * 4) % 2 ? '#7df9ff' : '#ffe66d', 'center');
  // breakdown
  const b = OV.br;
  drawPanel(40, 110, 290, 380, 'RUN REPORT', '#46d07c');
  const lines = [
    ['Distance', b.dist + ' m'], ['Clean jumps x' + b.jumps, '+' + b.jumpPts], ['Sprint bonus', '+' + b.sprint],
    ['Drafting', '+' + b.draft], ['Overtakes x' + b.over, '+' + b.overPts], ['Breakaway', '+' + b.boost],
    ['Stamina bonus', '+' + b.stam], ['Trips / bonks / bumps', '-' + b.pen]
  ];
  lines.forEach((l, i) => {
    const y = 172 + i * 22;
    txt(l[0], 58, y, 13, i === 7 ? '#ff9f9f' : '#dff5e5', 'left', fM, false);
    txt(l[1], 312, y, 13, i === 7 ? '#ff9f9f' : '#ffe66d', 'right', fM, false);
  });
  if (OV.mode === 'entry') {
    txt('ENTER YOUR INITIALS', 185, 337, 14, '#7df9ff', 'center');
    for (let i = 0; i < 3; i++) {
      const cx = SLOT_X[i], act = i === OV.pos;
      ctx.fillStyle = act ? '#ffe66d' : '#5f7a69';
      ctx.beginPath(); ctx.moveTo(cx - 12, 372); ctx.lineTo(cx + 12, 372); ctx.lineTo(cx, 355); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx - 12, 438); ctx.lineTo(cx + 12, 438); ctx.lineTo(cx, 455); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(cx - 28, 378, 56, 56, 8); ctx.fill();
      ctx.strokeStyle = act ? (Math.floor(tNow * 4) % 2 ? '#ffe66d' : '#fff') : '#5f7a69'; ctx.lineWidth = 3; rr(cx - 28, 378, 56, 56, 8); ctx.stroke();
      txt(LETTERS[OV.init[i]], cx, 407, 42, act ? '#ffe66d' : '#fff', 'center', fM);
    }
    const r = OVB.ok; ctx.fillStyle = '#2e8b4f'; rr(r.x, r.y, r.w, r.h, 16); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    txt('OK / ENTER', r.x + r.w / 2, r.y + r.h / 2 + 1, 14, '#fff', 'center', fH, false);
  } else {
    txt('RUN COMPLETE', 185, 345, 16, '#7df9ff', 'center');
    txt('Longest combo x' + b.best, 185, 380, 13, '#dff5e5', 'center', fM, false);
    txt(OV.hl ? 'Saved as ' + OV.hl.n : (OV.q ? '' : 'Not on the board - try again!'), 185, 410, 14, '#ffe66d', 'center', fM, false);
  }
  // boards
  drawPanel(350, 110, 280, 380, 'TOP SCORES', '#ffd23f');
  txt('SIMULATED GLOBAL TOP 5', 490, 158, 11, '#cdb24b', 'center', fM, false);
  drawBoard(368, 188, 244, globalBoard(OV.rm), OV.hl, 30, 17);
  txt('YOUR BEST', 490, 346, 12, '#cdb24b', 'center', fM, false);
  txt(String(bestScore(OV.rm)).padStart(6, '0'), 490, 376, 30, '#fff', 'center', fM);
  txt('Saved on this device', 490, 408, 11, '#9fb8a8', 'center', fM, false);
  drawPanel(650, 110, 270, 380, 'LOCAL TOP 10', '#46d07c');
  drawBoard(666, 160, 238, scoresBy[OV.rm], OV.hl, 30, 15);
  // play again / menu
  if (OV.mode === 'board') {
    const pulse = 0.75 + 0.25 * Math.sin(tNow * 6);
    ctx.globalAlpha = OV.t > 0.5 ? 1 : 0.4;
    [['again', 'PLAY AGAIN (ENTER)', '#e63946'], ['menu', 'MAIN MENU (ESC)', '#2a6fdb']].forEach(([k, label, col]) => {
      const r = OVB[k]; ctx.fillStyle = col; rr(r.x, r.y, r.w, r.h, 17); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + pulse + ')'; ctx.lineWidth = 3; ctx.stroke();
      txt(label, r.x + r.w / 2, r.y + r.h / 2 + 1, 15, '#fff', 'center', fH, false);
    });
    ctx.globalAlpha = 1;
  } else txt('↑↓ letter   ←→ slot   ENTER confirm   or type A-Z', W / 2, 515, 12, '#9fb8a8', 'center', fM, false);
  drawMuteIcon();
}

function renderTitle() {
  const sc = titleT * 190;
  drawTrailScene(sc);
  drawRunner(210, GY + 4, titleT * 10, { sprint: true });
  drawCyclist(720, GY + 56, 1.35, '#e63946', titleT * 7, titleT * 5.5, { me: true });
  ctx.fillStyle = 'rgba(4,14,9,.42)'; ctx.fillRect(0, 0, W, H);
  // logo
  ctx.save(); ctx.translate(W / 2, 100);
  ctx.font = fH(84); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const lg = ctx.createLinearGradient(0, -40, 0, 40); lg.addColorStop(0, '#7dff9f'); lg.addColorStop(1, '#2e8b4f');
  ctx.lineWidth = 12; ctx.strokeStyle = '#06210f'; ctx.strokeText('TRAIL', -170, -8); ctx.fillStyle = lg; ctx.fillText('TRAIL', -170, -8);
  const lg2 = ctx.createLinearGradient(0, -40, 0, 40); lg2.addColorStop(0, '#ffe66d'); lg2.addColorStop(1, '#f2a100');
  ctx.font = fH(56); ctx.lineWidth = 10; ctx.strokeStyle = '#2a1d00'; ctx.strokeText('&', 6, -8); ctx.fillStyle = lg2; ctx.fillText('&', 6, -8);
  ctx.font = fH(84); ctx.strokeStyle = '#14161b'; ctx.lineWidth = 12; ctx.strokeText('TARMAC', 190, 56); ctx.fillStyle = '#e8ecf1'; ctx.fillText('TARMAC', 190, 56);
  ctx.restore();
  txt('FOREST TRAIL  >>  OPEN ROAD  -  60 + 60 SECONDS', W / 2, 192, 17, '#fff', 'center', fM);
  // controls
  const px = 90, pw = 360;
  ctx.fillStyle = 'rgba(6,18,12,.78)'; rr(px, 222, pw, 150, 12); ctx.fill(); ctx.strokeStyle = '#46d07c'; ctx.lineWidth = 3; ctx.stroke();
  txt('1  TRAIL RUNNING', px + 18, 246, 17, '#7dff9f', 'left');
  ['TAP / SPACE : jump logs & rocks', 'HOLD / DOUBLE-TAP : sprint', 'Sprint drains STAMINA - hit 0 and trip!', 'Clean jumps refill stamina'].forEach((l, i) => txt(l, px + 18, 277 + i * 22, 13, '#fff', 'left', fM, false));
  ctx.fillStyle = 'rgba(6,18,12,.78)'; rr(W - px - pw, 222, pw, 150, 12); ctx.fill(); ctx.strokeStyle = '#f2b705'; ctx.stroke();
  txt('2  ROAD CYCLING', W - px - pw + 18, 246, 17, '#ffd23f', 'left');
  ['TAP SPACE / ← → : pedal  (hold = steady)', '↑ ↓ : change lane', 'DRAFT behind rivals: save stamina', 'SHIFT: breakaway in the final 15s'].forEach((l, i) => txt(l, W - px - pw + 18, 277 + i * 22, 13, '#fff', 'left', fM, false));
  // menu
  MENU.forEach((m, i) => {
    const r = menuRect(i), sel = i === menuSel;
    if (sel) { ctx.fillStyle = 'rgba(230,57,70,.9)'; rr(r.x, r.y, r.w, r.h, 13); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke(); }
    else { ctx.fillStyle = 'rgba(6,18,12,.6)'; rr(r.x, r.y, r.w, r.h, 13); ctx.fill(); }
    txt((sel ? '> ' : '') + m.t, W / 2, r.y + r.h / 2 + 1, 17, sel ? '#fff' : '#cfe8d6', 'center');
  });
  txt('↑↓ + ENTER or TAP  |  1-4 quick select  |  M sound  |  P pause', W / 2, 512, 12, '#9fb8a8', 'center', fM, false);
  drawMuteIcon();
}

function renderLB() {
  drawRoadScene(tNow * 100);
  ctx.fillStyle = 'rgba(4,14,9,.78)'; ctx.fillRect(0, 0, W, H);
  txt('LEADERBOARDS', W / 2, 30, 32, '#ffe66d', 'center');
  const cols = ['#ffd23f', '#46d07c', '#2aa9ff'];
  MODES.forEach((m, i) => {
    const r = LBT(i), act = i === lbTab;
    ctx.fillStyle = act ? cols[i] : 'rgba(255,255,255,.1)'; rr(r.x, r.y, r.w, r.h, 17); ctx.fill();
    ctx.strokeStyle = cols[i]; ctx.lineWidth = 2; ctx.stroke();
    txt(MODE_NAME[m], r.x + r.w / 2, r.y + r.h / 2 + 1, 15, act ? '#12141a' : '#fff', 'center', fH, false);
  });
  const m = MODES[lbTab];
  drawPanel(60, 112, 400, 366, 'GLOBAL TOP 5', cols[lbTab]);
  txt('SIMULATED - ' + MODE_NAME[m], 260, 156, 11, '#cdb24b', 'center', fM, false);
  drawBoard(100, 196, 320, globalBoard(m), null, 40, 20);
  drawPanel(500, 112, 400, 366, 'LOCAL TOP 10', cols[lbTab]);
  drawBoard(540, 176, 320, scoresBy[m], null, 30, 16);
  const r = LB_BACK; ctx.fillStyle = '#e63946'; rr(r.x, r.y, r.w, r.h, 17); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  txt('BACK (ESC)', r.x + r.w / 2, r.y + r.h / 2 + 1, 15, '#fff', 'center', fH, false);
  txt('← → or tap a tab', 140, 509, 12, '#9fb8a8', 'center', fM, false);
  drawMuteIcon();
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  if (mode === 'title') renderTitle();
  else if (mode === 'lb') renderLB();
  else if (mode === 'over' && OV) renderOver();
  else if (R) {
    renderPlay(); ctx.restore(); ctx.save(); renderOverlays();
    if (paused) {
      ctx.fillStyle = 'rgba(4,14,9,.75)'; ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, 200, 56, '#ffe66d', 'center');
      PAUSE_ITEMS.forEach((t, i) => {
        const r = pauseRect(i), sel = i === pauseSel;
        ctx.fillStyle = sel ? '#e63946' : 'rgba(255,255,255,.12)'; rr(r.x, r.y, r.w, r.h, 20); ctx.fill();
        ctx.strokeStyle = sel ? '#fff' : 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.stroke();
        txt(t, W / 2, r.y + r.h / 2 + 1, 18, '#fff', 'center');
      });
      txt('↑↓ + ENTER  |  P resume  |  Q quit to menu', W / 2, 440, 13, '#cfe8d6', 'center', fM, false);
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------- main loop */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  tNow += dt;
  update(dt); render();
}
requestAnimationFrame(frame);
cv.focus();
})();
</script>
